<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorly | Register</title>
  <meta name="description" content="Create a Tutorly account and book verified tutors for your child.">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link id="rtl-stylesheet" rel="stylesheet" href="assets/css/rtl.css" disabled>
</head>
<body style="background-color: var(--color-bg);">

  <div class="auth-toggles">
    <button class="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL">
      <i class="ph ph-arrows-left-right"></i>
    </button>
    <button class="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
      <i class="ph ph-moon"></i>
    </button>
  </div>

  <div class="auth-layout">
    <div class="card auth-card">
      <div class="auth-head">
        <a href="index.html" class="logo">
          <i class="ph ph-student"></i> Tutorly
        </a>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join the families learning with verified, vetted tutors.</p>
      </div>

      <form class="auth-form" action="dashboard.html">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Your full name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210" autocomplete="tel" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">I'm Signing Up As</label>
          <select id="role" name="role" class="form-control" required>
            <option value="">Choose your account type</option>
            <option value="parent">A parent booking for my child</option>
            <option value="student">A student booking for myself</option>
            <option value="tutor">A tutor offering lessons</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
              <i class="ph ph-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle-password="confirm-password" aria-label="Show password" aria-pressed="false">
              <i class="ph ph-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-meta">
          <label class="auth-check">
            <input type="checkbox" name="terms" required>
            <span>I agree to the <a href="#" class="text-primary">Terms &amp; Conditions</a> and the <a href="#" class="text-primary">Privacy Policy</a>.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
      </form>

      <div class="auth-divider">
        <span>or register with</span>
      </div>

      <div class="auth-social">
        <button type="button" class="btn btn-social">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
        <button type="button" class="btn btn-social">
          <i class="ph-fill ph-apple-logo"></i> Continue with Apple
        </button>
      </div>

      <p class="auth-foot">
        Already have an account? <a href="login.html" class="text-primary">Login here</a>
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
